name: Check readiness tools
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Parse the read-only PowerShell collector
        shell: pwsh
        run: |
          $tokens=$null; $parseErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'tools/Get-LabInventory.ps1'),[ref]$tokens,[ref]$parseErrors) | Out-Null
          if ($parseErrors) { $parseErrors; exit 1 }
